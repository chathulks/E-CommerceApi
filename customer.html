<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>E-Commerce API</title>
</head>

<body>

    <!-- Nav Bar Start -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">E||Commerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="/index.html">Dashboard</a>
                    <a class="nav-link" href="/product.html">Product Manage</a>
                    <a class="nav-link" href="/customer.html">Customer Manage</a>
                    <a class="nav-link" href="#">Cart & Order Manage</a>
                </div>
            </div>
        </div>
    </nav>
    <!-- Nav Bar End -->

    <!-- Button trigger modal -->
    <div class="container mt-4 mb-4">
        <div class="col d-flex justify-content-end">
            <input type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal"
                value="Customer Manage">
        </div>
    </div>
    <!-- Button trigger modal -->

    <div class="container d-flex justify-content-center align-items-center">
        <table class="table table-hover">
            <tr>
                <th>#</th>
                <th>User ID</th>
                <th>Username</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>E-mail</th>
                <th>Password</th>
                <th>Gender</th>
                <th>Status</th>
                <th>Address Line 1</th>
                <th>Address Line 2</th>
            </tr>
        </table>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-2" id="exampleModalLabel">Customer Manage</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <div class="row justify-content-center align-items-center p-4">
                        <div class="row mb-2">
                            <div class="col-3">
                                <label class="form-label">ID</label>
                                <input type="text" class="form-control" placeholder="C001" id="p_id">
                            </div>
                            <div class="col-9">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" placeholder="John" id="p_id">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label">E-mail</label>
                                <input type="text" class="form-control" placeholder="johan@gmail.com" id="p_id">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Password</label>
                                <input type="text" class="form-control" placeholder="pW12@#3ij!%" id="p_id">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-12">
                                <label class="form-label">Mobile</label>
                                <input type="text" class="form-control" placeholder="+94 702 221 234 " id="p_id">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" placeholder="John" id="p_id">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" placeholder="Frank" id="p_id">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" placeholder="kalutara" id="p_id">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Street</label>
                                <input type="text" class="form-control" placeholder="Rathnapura Road" id="p_id">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label">Number</label>
                                <input type="text" class="form-control" placeholder="7682" id="p_id">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Zipcode</label>
                                <input type="text" class="form-control" placeholder="12926-3874" id="p_id">
                            </div>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <input type="button" value="NEW" class="btn btn-secondary">
                    <input type="button" value="UPDATE" class="btn btn-warning">
                    <input type="button" value="DELETE" class="btn btn-danger">
                </div>
            </div>
        </div>
    </div>

</body>
