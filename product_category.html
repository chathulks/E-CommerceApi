<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>E-Commerce API</title>
</head>

<body>

    <!-- Nav Bar Start -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">E||Commerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
                    <a class="nav-link" href="#">Product Manage</a>
                    <a class="nav-link" href="#">Customer Manage</a>
                    <a class="nav-link" href="#">Cart & Order Manage</a>
                </div>
            </div>
        </div>
    </nav>
    <!-- Nav Bar End -->

    <div class="container">
        <div class="row">
            <div class="col-6">

                <div class="row mt-4">
                    <div class="col-6 border-start">
                        <div class="mt-3">
                            <input type="text" class="form-control" placeholder="ID" id="p_id">
                        </div>
                        <div class="mt-3 mb-3">
                            <input type="text" class="form-control" placeholder="Title" id="p_id">
                        </div>
                    </div>
                    <div class="col-6 border-start border-end">
                        <div class="mt-3">
                            <input type="text" class="form-control" placeholder="Price" id="p_id">
                        </div>
                        <div class="mt-3 mb-3">
                            <input type="text" class="form-control" placeholder="Descriptions" id="p_id">
                        </div>
                    </div>
                </div>

                <div class="row mt-4 mb-4">
                    <div class="col-6 border-start">
                        <div class="mt-3">
                            <input type="text" class="form-control" placeholder="Category" id="p_id">
                        </div>
                        <div class="mt-3 mb-3">
                            <input type="text" class="form-control" placeholder="Rate" id="p_id">
                        </div>
                    </div>
                    <div class="col-6 border-start border-end">
                        <div class="mt-3">
                            <input type="text" class="form-control" placeholder="Rate" id="p_id">
                        </div>
                        <div class="mt-3 mb-3">
                            <input type="file" class="form-control" placeholder="Image" id="p_id">
                        </div>
                    </div>
                </div>

                <div class="row border-start border-end">
                    <div class="col-4">
                        <input type="button" value="NEW" class="btn btn-outline-success col-12">
                    </div>
                    <div class="col-4">
                        <input type="button" value="UPDATE" class="btn btn-outline-warning col-12">
                    </div>
                    <div class="col-4">
                        <input type="button" value="DELETE" class="btn btn-outline-danger col-12">
                    </div>
                </div>

            </div>
            <div class="col-6">
                <div class="col-6">
                    <img src="product/product-management.png" alt="product images" >
                </div>
                <div class="col-6">

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
