<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>E-Commerce API</title>
</head>

<body>

    <!-- Nav Bar Start -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">E||Commerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
                    <a class="nav-link" href="#">Product Manage</a>
                    <a class="nav-link" href="#">Customer Manage</a>
                    <a class="nav-link" href="#">Cart & Order Manage</a>
                </div>
            </div>
        </div>
    </nav>
    <!-- Nav Bar End -->

    <div class="container">
        <div class="row mt-4">
            <div class="col-3 border-start">
                <input type="text" class="form-control" placeholder="ID" id="p_id">
            </div>
            <div class="col-3 border-start">
                <input type="text" class="form-control" placeholder="Title" id="p_id">
            </div>
            <div class="col-3 border-start">
                <input type="text" class="form-control" placeholder="Price" id="p_id">
            </div>
            <div class="col-3 border-start border-end">
                <input type="text" class="form-control" placeholder="Descriptions" id="p_id">
            </div>
        </div>
        <div class="row mt-4 mb-4">
            <div class="col-3 border-start">
                <input type="text" class="form-control" placeholder="Category" id="p_id">
            </div>
            <div class="col-3 border-start">
                <input type="text" class="form-control" placeholder="Rate" id="p_id">
            </div>
            <div class="col-3 border-start">
                <input type="text" class="form-control" placeholder="Count" id="p_id">
            </div>
            <div class="col-3 border-start border-end">
                <input type="file" class="form-control" placeholder="Image" id="p_id">
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 d-flex justify-content-center">
            <hr class="w-50" />
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>

</html>
